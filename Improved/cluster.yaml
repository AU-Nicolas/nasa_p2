apiVersion: v1
kind: Service
metadata:
  name: bully-service
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: bully
  ports:
    - port: 5000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bully
spec:
  serviceName: "bully-service"
  podManagementPolicy: Parallel 
  replicas: 3
  selector:
    matchLabels:
      app: bully
  template:
    metadata:
      labels:
        app: bully
    spec:
      terminationGracePeriodSeconds: 1  # PID 1 ignores SIGTERM; without this a removed pod keeps answering for 30 s
      containers:
        - name: node
          image: bully-node:improved
          imagePullPolicy: Always  # Each kind node caches images; Always fetches the newest local build
          ports:
            - containerPort: 5000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name